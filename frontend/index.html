<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voz del Ciudadano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Voz del Ciudadano</h1>
        <p>Plataforma de Iniciativas Legislativas</p>
    </header>

    <main>
        <section class="panel">
            <h2>Crear Iniciativa</h2>
            <form id="form-crear">
                <input type="text" id="titulo" placeholder="Título de la iniciativa" required>
                <textarea id="contenido" placeholder="Contenido o justificación..." required></textarea>
                <button type="submit">Registrar Iniciativa</button>
            </form>
        </section>

        <section class="panel">
            <h2>Iniciativas Registradas</h2>
            <button onclick="cargarIniciativas()" class="btn-refresh">Actualizar Lista</button>
            <div id="lista-iniciativas"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
